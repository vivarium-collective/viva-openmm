[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "pbg-openmm"
version = "0.1.0"
description = "Process-bigraph wrapper for OpenMM Martini coarse-grained molecular dynamics"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Eran Agmon", email = "agmon.eran@gmail.com"}]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "bigraph-schema>=0.0.60",
    "process-bigraph>=0.0.66",
    "openmm>=8.0",
    "setuptools",  # martini_openmm imports distutils (removed in py3.12)
    # martini_openmm is GitHub-only (not on PyPI); install separately:
    #   pip install "git+https://github.com/maccallumlab/martini_openmm.git"
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/vivarium-collective/pbg-openmm"
Issues = "https://github.com/vivarium-collective/pbg-openmm/issues"

[tool.hatch.build.targets.wheel]
packages = ["pbg_openmm"]

[tool.hatch.build.targets.wheel.force-include]
"pbg_openmm/data/martini_v3.0.0.itp" = "pbg_openmm/data/martini_v3.0.0.itp"
