[project]
name = "pbg-openmm"
# The pre-rename dist name. This shim just depends on viva-openmm so existing
# `pbg-openmm` deps keep resolving. Import `viva_openmm` (a `pbg_openmm` import
# shim also ships in viva-openmm). Keep the version in lockstep with viva-openmm.
version = "0.1.1"
description = "Deprecated alias — renamed to 'viva-openmm'. Depends on it so existing 'pbg-openmm' deps keep resolving."
requires-python = ">=3.10"
dependencies = ["viva-openmm>=0.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pbg_openmm_shim"]
