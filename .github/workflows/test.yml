name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (openmm from PyPI; martini_openmm only needed for @slow real-MD runs)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" openmm
      - name: Test (non-slow; validates the rename, shims, and OpenMM-importing modules)
        run: pytest -q
